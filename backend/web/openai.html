<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>第三方 OpenAI 接口 · SONIC</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/models.css">
  <script src="/vendor/lucide.js" defer></script>
  <script src="/openai.js" defer></script>
</head>
<body class="models-page">
  <header class="app-header"><a class="brand" href="/">SONIC<span class="brand-dot"></span></a><nav class="header-nav" aria-label="主导航"><a href="/">声音工作区</a><a href="/openai.html" aria-current="page">第三方接口</a><a href="/models.html">全部配置</a></nav></header>
  <main class="models-main">
    <div class="models-heading"><div><h1>第三方 OpenAI 接口</h1><p id="activeSummary" class="active-summary">正在读取配置</p></div><button id="newConnection" class="button primary"><i data-lucide="plus" aria-hidden="true"></i>新建接口</button></div>
    <div id="notice" class="model-notice" role="status" hidden></div>
    <div class="models-layout">
      <aside class="profiles-pane" aria-label="已保存的第三方接口"><div class="profile-list-heading"><h2>已保存接口</h2><span id="profileCount" class="count">0</span></div><div id="connections" class="profile-list"></div></aside>
      <section class="profile-editor" aria-labelledby="connectionTitle">
        <div class="profile-editor-heading"><div><h2 id="connectionTitle">新建接口</h2><span class="editor-state">OpenAI 兼容 · Chat Completions</span></div><a href="/models.html" class="button small quiet" title="管理全部配置"><i data-lucide="settings-2" aria-hidden="true"></i>管理</a></div>
        <form id="connectionForm" autocomplete="off">
          <div class="model-field"><label for="endpoint">接口地址 <span>Base URL</span></label><input id="endpoint" type="url" placeholder="https://api.example.com/v1" required spellcheck="false" maxlength="2048"></div>
          <div class="model-field"><div class="field-heading"><label for="secret">API Key</label><span id="keyState" class="field-state">未填写</span></div><div class="key-input"><input id="secret" type="password" autocomplete="new-password" placeholder="粘贴第三方 API Key" spellcheck="false"><button id="showSecret" type="button" class="icon-button" title="显示密钥" aria-label="显示密钥" aria-pressed="false"><i data-lucide="eye" aria-hidden="true"></i></button></div></div>
          <div class="model-field"><div class="field-heading"><label for="upstreamModels">上游模型</label><button id="syncModels" type="button" class="button small"><i data-lucide="refresh-cw" aria-hidden="true"></i><span>同步上游模型</span></button></div><select id="upstreamModels" disabled><option value="">尚未同步</option></select><span id="syncState" class="field-state" role="status"></span></div>
          <div class="model-field"><label for="chosenModel">模型名称</label><input id="chosenModel" placeholder="从上方选择，或手动填写模型 ID" required maxlength="200" spellcheck="false"></div>
          <div class="model-field"><label for="connectionName">接口名称 <span>可选</span></label><input id="connectionName" placeholder="留空使用模型名称" maxlength="100"></div>
          <div class="save-actions"><button id="enableConnection" class="button primary" type="submit"><i data-lucide="check" aria-hidden="true"></i>保存并启用</button><a class="button" href="/"><i data-lucide="audio-lines" aria-hidden="true"></i>返回声音工作区</a></div>
        </form>
        <section class="connection-tests"><div class="test-heading"><h2>模型测试</h2><span class="field-state">少量用量，按上游平台计费</span></div><div class="test-row"><i data-lucide="message-square" aria-hidden="true"></i><div class="test-copy"><h3>文字连通</h3><p id="textResult" role="status">尚未测试</p></div><button id="probeText" class="button small"><i data-lucide="play" aria-hidden="true"></i>测试文字</button></div><div class="test-row"><i data-lucide="audio-lines" aria-hidden="true"></i><div class="test-copy"><h3>音频理解</h3><p id="audioResult" role="status">尚未测试 · 使用合成旋律</p></div><button id="probeAudio" class="button small"><i data-lucide="play" aria-hidden="true"></i>测试音频</button></div></section>
        <div class="model-footer"><i data-lucide="lock-keyhole" aria-hidden="true"></i><span>密钥仅保存在本机，调用时发送至你填写的接口。</span></div>
      </section>
    </div>
  </main>
</body>
</html>
